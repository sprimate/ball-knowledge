server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The team data file is ~25 MB of JSON; compress it and let browsers cache it.
    gzip on;
    gzip_types application/json application/javascript text/css text/html image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        # Vite hashes asset file names, so they can be cached forever.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /data/ {
        add_header Cache-Control "public, max-age=86400";
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
